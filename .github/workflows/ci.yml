name: ci

# The toolkit runs on a bench laptop, which is Windows, but it is developed on
# whatever people have. Both are built here so a change that only works on one
# of them fails before it reaches a bench.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install -e ".[dev]"

      - name: ruff
        run: python -m ruff check src tests

      - name: mypy
        run: python -m mypy

  test:
    name: test ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install -e ".[dev]"

      - name: test
        run: >
          python -m pytest
          --cov=v4t_setup
          --cov-report=term-missing:skip-covered
          --cov-report=xml
          --junit-xml=junit.xml

      - name: upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}-py${{ matrix.python }}
          path: junit.xml
          if-no-files-found: warn

  coverage:
    name: coverage floor
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install -e ".[dev]"

      # The floor is deliberately below where the suite actually sits, which is
      # 96 percent. It is there to catch a change that guts the tests, not to be
      # a target that people write assertion free tests to reach.
      - name: test with a coverage floor
        run: python -m pytest --cov=v4t_setup --cov-report=term-missing --cov-fail-under=90

  package:
    name: build and install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build
        run: |
          python -m pip install --upgrade pip==24.3.1 build==1.2.2.post1
          python -m build

      # Installing the wheel into a clean environment catches a module that is
      # imported but not packaged, which the editable install used everywhere
      # else will never notice.
      - name: install the wheel and run the CLI
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install dist/*.whl
          /tmp/clean/bin/v4t-setup --version
          /tmp/clean/bin/v4t-setup checks
          /tmp/clean/bin/v4t-setup rules
          /tmp/clean/bin/v4t-setup formats
          /tmp/clean/bin/v4t-setup gs1 labels
          /tmp/clean/bin/v4t-setup gs1 parse "(01)01001000173250(21)0001"

      # doctor is the command a support call starts with, so it has to work in
      # the one environment nobody tests by hand: a clean install with nothing
      # else in the directory. --strict is what a build server wants, and the
      # only warning here is the missing settings file, so this run has to fail.
      # Running it both ways is the point. A --strict that always failed would
      # pass a test that only ever ran it in an empty directory.
      - name: doctor knows it has no settings file
        run: |
          cd /tmp
          /tmp/clean/bin/v4t-setup doctor
          set +e
          /tmp/clean/bin/v4t-setup doctor --strict
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected --strict to fail, got $code"; exit 1; }
          printf 'staging_root = "_staging"\n' > v4t-setup.toml
          /tmp/clean/bin/v4t-setup doctor --strict

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  shipped-data:
    name: check the shipped payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install -e ".[dev]"

      # setup.aip and the template set are inputs the whole toolkit is built
      # around. If somebody edits one, this says so on the pull request rather
      # than on a bench.
      - name: read the project file
        run: python -m v4t_setup bundle inspect setup.aip

      - name: lint the shipped template
        run: >
          python -m v4t_setup template lint
          "Matricode/Quattro/Templates/T1.spf"

      # The shipped GS1 data has known findings, so a clean exit here would mean
      # the linter had stopped working.
      - name: the shipped GS1 data still reports its known findings
        run: |
          set +e
          python -m v4t_setup gs1 check "Matricode/Quattro/Templates/GS1-1.txt" \
            --format json --output gs1.json
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }
          python - <<'PY'
          import json, sys
          report = json.loads(open("gs1.json").read())
          counts = report["counts"]
          if counts.get("error", 0) < 100:
              sys.exit(f"expected the known findings, got {counts}")
          print("gs1 findings:", counts)
          PY

      # The shipped MSI is internally consistent, so this one has to stay clean.
      - name: read the built installer
        run: python -m v4t_setup bundle msi msi-quattro/msi-Jet600.msi

      # And it was not built from the project file beside it, so this one has to
      # stay dirty. Both directions matter: a comparator that says two unrelated
      # installers match is worse than no comparator.
      - name: the installer still does not match the project file
        run: |
          set +e
          python -m v4t_setup bundle match \
            msi-quattro/msi-Jet600.msi setup.aip --format json --output match.json
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }
          python - <<'PY'
          import json, sys
          report = json.loads(open("match.json").read())
          findings = [
              finding
              for section in report["sections"]
              for finding in section.get("findings", [])
          ]
          codes = [f["subject"] for f in findings]
          if "UpgradeCode" not in codes:
              sys.exit(f"expected an UpgradeCode finding, got {codes}")
          print("match findings:", len(findings))
          PY

      # An MSI compared with itself has to come out empty. This is the control
      # on the differ: it is easy to write one that reports every row as changed
      # and looks busy and correct until somebody reads it.
      - name: the installer does not differ from itself
        run: |
          python -m v4t_setup bundle msi-diff \
            msi-quattro/msi-Jet600.msi msi-quattro/msi-Jet600.msi \
            --format json --output self.json
          python - <<'PY'
          import json, sys
          facts = json.loads(open("self.json").read())["facts"]
          if facts["identical"] != "yes" or facts["changed_rows"] != "0":
              sys.exit(f"an installer differs from itself: {facts}")
          PY

      # The export has to round trip. Orca writes these, people hand edit them,
      # and a reader that cannot read what the writer wrote is worse than no
      # export at all because the damage shows up at install time.
      - name: export the installer tables and read them back
        run: |
          python -m v4t_setup bundle msi-export \
            msi-quattro/msi-Jet600.msi --into idt
          python - <<'PY'
          import sys
          from pathlib import Path
          from v4t_setup.msi.export import parse_idt
          from v4t_setup.msi.tables import read_msi

          database = read_msi(Path("msi-quattro/msi-Jet600.msi"))
          for path in sorted(Path("idt").glob("*.idt")):
              name = path.stem
              table = parse_idt(path.read_bytes().decode("cp1252"))
              expected = len(database.get(name))
              if len(table) != expected:
                  sys.exit(f"{name}: exported {expected}, read back {len(table)}")
          print("round tripped", len(list(Path("idt").glob("*.idt"))), "tables")
          PY
